<!doctype html>
<html lang="ru">

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Вьетнамский язык — группа Светы</title>

    <!-- Установка значком на главный экран телефона (iOS и Android). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#0f7a72" />
    <!-- iOS не читает display:standalone из manifest.json — только эти теги. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tiếng Việt" />
  </head>
