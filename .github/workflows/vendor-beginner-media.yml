name: Vendor beginner media once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/vendor-beginner-media.yml']
permissions:
  contents: write
concurrency:
  group: vendor-beginner-media
  cancel-in-progress: false
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: xpkostxp-droid/AlexViet
          ref: 1f46b3d4114fbd1a574ccf000b1d6129877c4b14
          path: _media_source
          persist-credentials: false
      - name: Store the imported media permanently in VietSveta
        run: |
          mkdir -p public/beginner
          cp -a _media_source/public/. public/beginner/
          rm -rf _media_source
          git add -f public/beginner
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Vendor beginner audio and images into VietSveta'
          git push origin HEAD:main
