name: Публикация на GitHub Pages

# Запускается автоматически при каждом обновлении ветки main —
# ничего вручную собирать и загружать не нужно, достаточно запушить
# изменения (например, через GitHub Desktop).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout beginner media at the imported revision
        uses: actions/checkout@v4
        with:
          repository: xpkostxp-droid/AlexViet
          ref: 1f46b3d4114fbd1a574ccf000b1d6129877c4b14
          path: _beginner_source
          persist-credentials: false
      - name: Include beginner audio and images in the same site
        run: |
          mkdir -p public/beginner
          cp -a _beginner_source/public/. public/beginner/
          rm -rf _beginner_source
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npm run test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
